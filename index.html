<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>אינסוף</title>
<meta name="description" content="אינסוף — תרגול חשבון לכיתות א׳–ב׳" />
<meta name="theme-color" content="#fef6e4" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="אינסוף" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="preload" href="fonts/noto-sans-hebrew-hebrew.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/noto-sans-hebrew-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<!-- SugiGames opening animation (shared with the other Sugi apps). -->
<div id="splash" role="status" aria-label="SugiGames">
  <svg id="kanji-svg" viewBox="0 0 100 100" width="160" height="160" aria-hidden="true">
    <defs>
      <linearGradient id="trunkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#b07a50" />
        <stop offset="100%" stop-color="#7c4e30" />
      </linearGradient>
      <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#8de89c" />
        <stop offset="100%" stop-color="#2fae64" />
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#trunkGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path class="kanji-stroke" d="M 14 34 C 24 33, 36 33.5, 46 34.5" />
      <path class="kanji-stroke" d="M 30 12 C 29.5 32, 30 55, 30 88" />
      <path class="kanji-stroke" d="M 30 42 C 25 50, 20 58, 16 66" />
      <path class="kanji-stroke" d="M 30 42 C 35 50, 40 58, 44 66" />
    </g>
    <g fill="none" stroke="url(#leafGradient)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path class="kanji-stroke" d="M 76 14 C 68 20, 62 26, 58 32" />
      <path class="kanji-stroke" d="M 86 40 C 76 47, 68 54, 62 60" />
      <path class="kanji-stroke" d="M 96 68 C 84 76, 74 82, 66 90" />
    </g>
    <circle id="brush-tip" r="4.2" fill="#ffffff" opacity="0" />
  </svg>
  <div id="splash-word" dir="ltr"><span class="word-sugi">Sugi</span><span class="word-games">Games</span></div>
</div>

<main id="app" class="screen"></main>

<script src="js/data.js"></script>
<script src="js/numbers.js"></script>
<script src="js/gen.js"></script>
<script src="js/audio.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/splash.js"></script>
<script>
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
